
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Vortex</title>

<style>
:root {
  --bg: #f4f1fa;
  --box: #d0d0d6;
  --card: #181818;
  --ink: #181818;
  --btnink: #f4f1fa;
  --borderline: #c7c2d0;
  --btn: #181818;
  --btnshadow: #0e0e0e;
  --btn2: #ddd6ec;
  --mark: #ffd84d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  line-height: 1.5;
}

.screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1.25rem;
}

.hidden {
  display: none !important;
}

.panel {
  background: var(--box);
  padding: 2.5rem 2rem;
  margin: 0 auto;
  max-width: 720px;
  width: 100%;
  border-radius: 1rem;
  box-shadow: 0 .25rem 1rem rgba(0,0,0,.1);
}

h1 {
  margin: 0 auto;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  letter-spacing: -.02em;
}

p {
  margin: .6rem 0 1rem;
}

button {
  background-color: var(--btn);
  color: var(--btnink);
  font-size: 1rem;
  font-weight: bold;
  padding: 1rem 2rem;
  border: none;
  border-radius: .5rem;
  margin: .5rem;
  box-shadow: 0 .5rem 0 var(--btnshadow);
  cursor: pointer;
  user-select: none;
  transition: transform .05s, box-shadow .05s;
}

button:active {
  transform: translateY(.5rem);
  box-shadow: 0 0 0 var(--btnshadow);
}

#board {
  display: grid;
  grid-template-columns: repeat(4, minmax(60px, 95px));
  gap: .7rem;
  justify-content: center;
  margin: 1.5rem auto;
}

.card {
  min-width: 0;
  aspect-ratio: 1 / 1;
  border-radius: .75rem;
  background: var(--card);
  color: white;
  border: 2px solid #333;
  font-size: clamp(1.5rem, 6vw, 2.3rem);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 4px 0 #090909;
  transition: transform .12s, background .2s;
}

.card:hover {
  transform: translateY(-2px);
}

.card.matched {
  background: #8270a5;
  border-color: #655583;
  cursor: default;
  box-shadow: 0 4px 0 #51416f;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  flex-wrap: wrap;
  font-weight: bold;
}

#message {
  min-height: 2rem;
}

@media (max-width: 400px) {
  .panel {
    padding: 1.5rem 1rem;
  }

  #board {
    gap: .5rem;
    grid-template-columns: repeat(4, minmax(55px, 75px));
  }

  button {
    padding: .85rem 1.2rem;
  }
}
</style>
</head>

<body>

<!-- MAIN MENU -->
<section id="menu-screen" class="screen">

  <div class="panel">

    <h1 id="title">MEMORY VORTEX</h1>

    <p>How many cards can you match?</p>

    <div>
      <button onclick="startGame('easy')">Easy</button>
      <button onclick="startGame('normal')">Normal</button>
      <button onclick="startGame('hard')">Hard</button>
    </div>

  </div>

</section>


<!-- GAME SCREEN -->
<section id="game-screen" class="screen hidden">

  <div class="panel">

    <h1 id="level-title">Easy Level</h1>

    <p>Flip the cards and find all matching pairs!</p>

    <div class="stats">
      <span>
        ⏱ Time:
        <span id="timer">0</span> seconds
      </span>

      <span>
        🃏 Matches:
        <span id="match-count">0</span>
      </span>

    </div>

    <div id="board"></div>

    <h2 id="message"></h2>

    <button onclick="restartGame()">Restart</button>

    <button onclick="goToMenu()">Return to Menu</button>

  </div>

</section>


<script>

// EMOJIS
const allEmojis = [
  "❤️","😍","👍","🙌",
  "⭐","🐱","🍀","🎈",
  "🌙","🍎","🎵","🐶",
  "🌻","⚽","🍕","🦋"
];

let currentLevel = "easy";
let gameEmojis = [];

let firstCard = null;
let secondCard = null;

let matched = 0;
let seconds = 0;
let lock = false;
let timer = null;


// START GAME
function startGame(level) {

  currentLevel = level;

  let pairCount;

  if (level === "easy") {
    pairCount = 4;
  } 
  else if (level === "normal") {
    pairCount = 6;
  } 
  else {
    pairCount = 8;
  }

  gameEmojis = allEmojis
    .slice(0, pairCount)
    .flatMap(emoji => [emoji, emoji]);

  document.getElementById("menu-screen")
    .classList.add("hidden");

  document.getElementById("game-screen")
    .classList.remove("hidden");

    /* makes the level title reflect the selected difficulty */
  document.getElementById("level-title").textContent =
    level.charAt(0).toUpperCase() +
    level.slice(1) + " Level";

  buildGame();
}


// BUILD GAME
function buildGame() {

  clearInterval(timer);

  seconds = 0;
  matched = 0;
  firstCard = null;
  secondCard = null;
  lock = false;

  document.getElementById("timer").textContent = "0";

  document.getElementById("match-count").textContent = "0";

  document.getElementById("message").textContent = "";

  let board = document.getElementById("board");

  board.innerHTML = "";

  let cards = [...gameEmojis];

  cards.sort(() => Math.random() - 0.5);

  cards.forEach(function(emoji) {

    let card = document.createElement("button");

    card.className = "card";
    card.type = "button";
    card.textContent = "?";

    card.dataset.emoji = emoji;

    card.setAttribute("aria-label", "Hidden card");

    card.onclick = function() {
      flipCard(card);
    };

    board.appendChild(card);

  });


  // TIMER
  timer = setInterval(function() {

    seconds++;

    document.getElementById("timer").textContent = seconds;

  }, 1000);

}


// FLIP CARD
function flipCard(card) {

  if (
    lock ||
    card.textContent !== "?" ||
    card.classList.contains("matched")
  ) {
    return;
  }

  card.textContent = card.dataset.emoji;

  card.setAttribute("aria-label", card.dataset.emoji);


  if (firstCard === null) {

    firstCard = card;

    return;

  }


  secondCard = card;

  lock = true;


  // CHECK MATCH
  if (firstCard.dataset.emoji === secondCard.dataset.emoji) {

    firstCard.classList.add("matched");

    secondCard.classList.add("matched");

    matched += 2;

    document.getElementById("match-count").textContent = matched / 2;

    firstCard = null;
    secondCard = null;

    lock = false;


    // WIN CONDITION
    if (matched === gameEmojis.length) {

      clearInterval(timer);

      document.getElementById("message").textContent =
        "🎉 You won! Completed in " + seconds + " seconds!";

    }

  } 
  else {

    // HIDE NON-MATCHING CARDS
    setTimeout(function() {

      firstCard.textContent = "?";

      secondCard.textContent = "?";

      firstCard.setAttribute("aria-label", "Hidden card");

      secondCard.setAttribute("aria-label", "Hidden card");

      firstCard = null;

      secondCard = null;

      lock = false;

    }, 800);

  }

}


// RESTART GAME
function restartGame() {

  buildGame();

}


// RETURN TO MENU
function goToMenu() {

  clearInterval(timer);

  document.getElementById("game-screen")
    .classList.add("hidden");

  document.getElementById("menu-screen")
    .classList.remove("hidden");

}

</script>

</body>
</html>
