    <title>Gradient Background Example</title>
    <style>
        .gradient-box {
            width: 100%;
            height: 300px;
            /* Syntax: linear-gradient(direction, color1, color2, ...) */
            background: linear-gradient(to right, purple, purple, blue, indigo ); 
            
            /* Center text inside the box */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            font-size: 24px;
        }
