<!DOCTYPE html>
<html lang = "eng">
  <head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <link rel = "stylesheet" href = "stylesheet.css">
    <script src = "memory_vortex_script.js" defer> </script>
    <title> Memory Vortex </title>
  </head> 
<body>
  <!-- MAIN MENU -->
  <nav id = "menu-screen" class = "screen"> <!-- <nav> element used for a page that links to other pages or to parts within the page (https://html.spec.whatwg.org/multipage/sections.html#the-nav-element). -->
    <div class = "panel"> <!-- class = "panel" used for design across the html panel-like elements. -->
      <h1 id = "title"> MEMORY VORTEX </h1>
      <p> How many cards can you match? </p>
      <!-- id attribute to group the buttons for possible styling and javascript shenanigans. -->
      <div id = "button-group"> 
        <!-- onclick tells the browser to run JavaScript when the buttons are clicked, calling the function for each specific id. -->
        <!-- specific id for the buttons for possible styling and javascript shenanigans. -->
        <button id = "easy-level-btn" onclick = "startGame('easy')"> Easy </button> 
        <button id = "normal-level-btn" onclick = "startGame('normal')"> Normal </button>
        <button id = "hard-level-btn" onclick="startGame('hard')"> Hard </button>
      </div>
    </div>
  </nav>

  <!-- GAME SCREEN -->
  <section id = "game-screen" class = "screen hidden">
    <div class = "panel">
      <!-- id = "level-title" used to make the title reflect the selected level/difficulty. -->
      <h1 id = "level-title"> Easy Level </h1>
      <p> Flip the cards and find all matching pairs! </p>
      <p> Time: <span id="timer">0</span> seconds </p>
      <div class = "stats">
        <!-- span id = "timer" displays the elapsed seconds, found in JavaScript using the id. -->
        ⏱ Time:
        <span id = "timer"> 0 </span> seconds
        <!-- span id = "match-count" displays the number of matched pairs.-->
        🃏 Matches:
        <span id = "match-count"> 0 </span>
      </div>
      <!-- board div is an empty container where the game cards appear through JavaScript. -->
      <div id = "board"></div>
      <!-- completion message added through JavaScript. --> 
      <h2 id ="message"></h2>
      <button onclick = "restartGame()">Restart</button>
      <button onclick = "goToMenu()">Return to Menu</button>
    </div>
  </section>
</body>
</html>
